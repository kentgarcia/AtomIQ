        stroke-width="10"
        stroke-linecap="round"
      />
      <!-- Purple Iris -->
      <ellipse cx="131" cy="183" rx="68" ry="75" fill="url(#heroicon_irisGrad)" stroke="#8260A8" stroke-width="5" />
      <g clip-path="url(#heroicon_irisLeftClip)">
