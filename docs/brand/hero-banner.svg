      id="heroicon_coat-right"
      d="M 520 456 L 324 470 L 294 518 L 520 518 Z"
      fill="#EAF3FC"
      stroke="#A2AEBC"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>

