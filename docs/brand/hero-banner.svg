<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AtomIQ — Make the atom make sense.">
  <defs>
    <clipPath id="hero_card_clip">
      <rect x="8" y="8" width="1184" height="352" rx="30" ry="30"/>
    </clipPath>
    <clipPath id="hero_icon_clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Tactile bottom lip -->
  <rect x="8" y="20" width="1184" height="352" rx="30" ry="30" fill="#D9981A"/>
  <!-- Main sunburst yellow face -->
  <rect x="8" y="8" width="1184" height="352" rx="30" ry="30" fill="#F9B71F"/>

  <!-- Subtle flat geometric highlight band + science doodles clipped to card -->
  <g clip-path="url(#hero_card_clip)">
    <circle cx="960" cy="190" r="245" fill="#FFC83D" opacity="0.55"/>
    <circle cx="960" cy="190" r="175" fill="#FFD35C" opacity="0.45"/>
    
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <!-- Top-left atom -->
    <g transform="translate(86, 62) scale(0.85)">
      <ellipse cx="0" cy="0" rx="34" ry="13" stroke-width="3.2" transform="rotate(-25)"/>
      <ellipse cx="0" cy="0" rx="34" ry="13" stroke-width="3.2" transform="rotate(35)"/>
      <ellipse cx="0" cy="0" rx="34" ry="13" stroke-width="3.2" transform="rotate(95)"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- Top-center flask -->
    <g transform="translate(520, 48) rotate(14) scale(0.85)">
      <path d="M-8 -22 H8 M-5 -22 V-8 L-20 18 Q-23 23 -17 23 H17 Q23 23 20 18 L5 -8 V-22" stroke-width="3.2"/>
      <path d="M-12 10 H12" stroke-width="2.6"/>
      <circle cx="-4" cy="16" r="2.2" fill="#FFFFFF" stroke="none"/>
      <circle cx="5" cy="14" r="1.8" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- Bottom-left shield -->
    <g transform="translate(150, 320) rotate(-10) scale(0.8)">
      <path d="M0 -24 L20 -16 V4 C20 16 10 24 0 28 C-10 24 -20 16 -20 4 V-16 Z" stroke-width="3.2"/>
      <path d="M-7 2 L-2 7 L9 -5" stroke-width="3.2"/>
    </g>
    <!-- Bottom-center diamond -->
    <g transform="translate(650, 326) rotate(8) scale(0.85)">
      <polygon points="0,-20 20,-4 0,20 -20,-4" stroke-width="3.2"/>
      <line x1="-20" y1="-4" x2="20" y2="-4" stroke-width="2.5"/>
    </g>
    <!-- Top-right bolt -->
    <g transform="translate(1122, 68) rotate(12) scale(0.85)">
      <polygon points="4,-22 -14,3 0,3 -4,22 14,-3 0,-3" stroke-width="3.2"/>
    </g>
    <!-- Bottom-right atom -->
    <g transform="translate(1110, 314) scale(0.9)">
      <ellipse cx="0" cy="0" rx="32" ry="12" stroke-width="3.2" transform="rotate(-30)"/>
      <ellipse cx="0" cy="0" rx="32" ry="12" stroke-width="3.2" transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="32" ry="12" stroke-width="3.2" transform="rotate(90)"/>
      <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>
  <!-- Crisp 4-point sparkles -->
  <g fill="#FFFFFF" opacity="0.55">
    <path d="M775 56 Q777 66 787 68 Q777 70 775 80 Q773 70 763 68 Q773 66 775 56 Z"/>
    <path d="M1072 118 Q1073.5 125 1080.5 126.5 Q1073.5 128 1072 135 Q1070.5 128 1063.5 126.5 Q1070.5 125 1072 118 Z"/>
    <path d="M808 310 Q809.5 317 816.5 318.5 Q809.5 320 808 327 Q806.5 320 799.5 318.5 Q806.5 317 808 310 Z"/>
    <circle cx="748" cy="112" r="4"/>
    <circle cx="1088" cy="242" r="5"/>
  </g>
  </g>

  <!-- Subtle crisp inner top edge -->
  <rect x="10" y="10" width="1180" height="348" rx="28" ry="28" fill="none" stroke="#FFE082" stroke-width="2" opacity="0.6"/>

  <!-- LEFT CONTENT COLUMN -->
  <g transform="translate(64, 55)">
    <!-- App Wordmark -->
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">AtomIQ</text>
    <text x="2" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#5B3800" letter-spacing="-0.4">Make the atom make sense.</text>

    <!-- Description lines -->
    <text x="2" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#6E4606">Short visual lessons, a cast of teachers, a fictional science phone,</text>
    <text x="2" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#6E4606">and a platformer to play between questions — zero account required.</text>

    <!-- Chunky Face-and-Lip Feature Chips -->
    <g transform="translate(0, 206)">
      <!-- Chip 1: 5-min lessons -->
      <rect x="0" y="4" width="138" height="38" rx="12" fill="#1899D6"/>
      <rect x="0" y="0" width="138" height="38" rx="12" fill="#1CB0F6"/>
      <text x="69" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">5-min lessons</text>

      <!-- Chip 2: 100% offline -->
      <rect x="150" y="4" width="134" height="38" rx="12" fill="#5F42A0"/>
      <rect x="150" y="0" width="134" height="38" rx="12" fill="#7F5AC2"/>
      <text x="217" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">100% offline</text>

      <!-- Chip 3: Atom Maze -->
      <rect x="296" y="4" width="128" height="38" rx="12" fill="#46A302"/>
      <rect x="296" y="0" width="128" height="38" rx="12" fill="#58CC02"/>
      <text x="360" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">Atom Maze</text>

      <!-- Chip 4: Science Phone -->
      <rect x="436" y="4" width="144" height="38" rx="12" fill="#C2410C"/>
      <rect x="436" y="0" width="144" height="38" rx="12" fill="#EA580C"/>
      <text x="508" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">Science Phone</text>
    </g>
  </g>

  <!-- RIGHT HERO VISUAL: Shrodi Framed Badge + Orbital Rings + Speech Bubble -->
  <g transform="translate(950, 190)">
    <!-- Orbital atom rings behind Shrodi -->
    <g fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.72">
      <ellipse cx="0" cy="0" rx="158" ry="62" transform="rotate(-24)"/>
      <ellipse cx="0" cy="0" rx="158" ry="62" transform="rotate(24)"/>
    </g>
    <!-- Orbiting electrons -->
    <circle cx="-134" cy="58" r="10" fill="#1CB0F6" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="136" cy="-54" r="10" fill="#7F5AC2" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="122" cy="70" r="9" fill="#58CC02" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- Shrodi App Icon Card with chunky lip -->
    <g transform="translate(-100, -100)">
      <rect x="-8" y="-2" width="216" height="216" rx="50" fill="#D9981A"/>
      <rect x="-8" y="-10" width="216" height="216" rx="50" fill="#FFFFFF"/>
      <g transform="scale(0.390625)" clip-path="url(#hero_icon_clip)">
        
  
  <defs>
    <!-- Soft gradients matching the original icon finish; easily editable in Inkscape/Figma -->
    <linearGradient id="heroicon_irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#482C62" />
      <stop offset="62%" stop-color="#5E3F7F" />
      <stop offset="100%" stop-color="#7B5AA0" />
    </linearGradient>
    <linearGradient id="heroicon_irisGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A78C4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#AE92CF" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="heroicon_pawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8412" />
      <stop offset="100%" stop-color="#F06802" />
    </linearGradient>
    <clipPath id="heroicon_lensLeftClip">
      <circle cx="117" cy="182" r="108" />
    </clipPath>
    <clipPath id="heroicon_lensRightClip">
      <circle cx="395" cy="182" r="108" />
    </clipPath>
    <clipPath id="heroicon_mouthClip">
      <path d="M 210 301 C 228 303 246 296 256 282 C 266 296 284 303 302 301 C 308 360 294 416 256 416 C 218 416 204 360 210 301 Z" />
    </clipPath>
    <clipPath id="heroicon_irisLeftClip">
      <ellipse cx="131" cy="183" rx="66" ry="73" />
    </clipPath>
    <clipPath id="heroicon_irisRightClip">
      <ellipse cx="381" cy="183" rx="66" ry="73" />
    </clipPath>
  </defs>

  <!-- LAYER 1: Background / Forehead Fur -->
  <g id="heroicon_layer-background">
    <rect id="heroicon_bg-fill" x="0" y="0" width="512" height="512" fill="#FDA539" />
  </g>

  <!-- LAYER 2: Neck & Lab Coat Shoulders -->
  <g id="heroicon_layer-lab-coat">
    <!-- Orange neck fur -->
    <path id="heroicon_neck-fur" d="M 184 468 L 328 468 L 306 516 L 206 516 Z" fill="#F17F03" />
    <ellipse id="heroicon_neck-highlight" cx="256" cy="512" rx="30" ry="11" fill="#FDA942" />
    <!-- Left coat collar & shoulder -->
    <path
      id="heroicon_coat-left"
      d="M -8 456 L 188 470 L 218 518 L -8 518 Z"
      fill="#EAF3FC"
      stroke="#A2AEBC"
      stroke-width="6"
