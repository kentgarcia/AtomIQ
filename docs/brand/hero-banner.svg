      <path
        d="M 272 60 L 512 60 L 512 232 L 494 232 Q 498 196 486 164 Q 460 92 400 88 Q 342 86 272 132 Z"
        fill="#FDA539"
      />
      <path
        d="M 490 224 Q 498 166 468 120 Q 434 84 388 84 Q 334 84 290 128"
        fill="none"
        stroke="#FCD297"
        stroke-width="10"
        stroke-linecap="round"
      />
      <!-- Purple Iris -->
      <ellipse cx="381" cy="183" rx="68" ry="75" fill="url(#heroicon_irisGrad)" stroke="#8260A8" stroke-width="5" />
      <g clip-path="url(#heroicon_irisRightClip)">
        <!-- Smooth lower lavender crescent -->
        <path
          d="M 322 204 Q 381 246 440 204 C 444 242 414 264 381 264 C 348 264 318 242 322 204 Z"
          fill="url(#heroicon_irisGlow)"
        />
      </g>
      <!-- Specular white oval + small dot -->
      <ellipse cx="353" cy="150" rx="23" ry="30" transform="rotate(14 353 150)" fill="#FFFFFF" />
      <circle cx="339" cy="212" r="10.5" fill="#FFFFFF" />
      <!-- 4-point Golden Star Sparkle -->
      <path
        d="M 414 162 Q 417 183 436 187 Q 417 191 414 212 Q 411 191 392 187 Q 411 183 414 162 Z"
        fill="#FCE065"
        stroke="#CFA028"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- LAYER 5: Round Glasses Frame -->
  <g id="heroicon_layer-glasses">
    <path
      id="heroicon_glasses-bridge"
      d="M 228 179 Q 256 167 284 179"
      fill="none"
      stroke="#313231"
      stroke-width="16.5"
      stroke-linecap="butt"
    />
    <circle id="heroicon_glasses-left" cx="117" cy="182" r="115" fill="none" stroke="#313231" stroke-width="16.5" />
    <circle id="heroicon_glasses-right" cx="395" cy="182" r="115" fill="none" stroke="#313231" stroke-width="16.5" />
  </g>

  <!-- LAYER 6: Nose, Smile & Open Mouth -->
  <g id="heroicon_layer-nose-mouth">
    <!-- Open Mouth Interior -->
    <path
      id="heroicon_mouth-interior"
      d="M 210 301 C 228 303 246 296 256 282 C 266 296 284 303 302 301 C 308 360 294 416 256 416 C 218 416 204 360 210 301 Z"
      fill="#98211D"
    />
    <!-- Pink Tongue -->
    <g id="heroicon_mouth-tongue" clip-path="url(#heroicon_mouthClip)">
      <ellipse cx="256" cy="396" rx="44" ry="44" fill="#EB8287" />
    </g>
    <!-- Single Closed Mouth Outline (zero overlapping open ends) -->
    <path
      id="heroicon_mouth-outline"
      d="M 210 301 C 228 303 246 296 256 282 C 266 296 284 303 302 301 C 308 360 294 416 256 416 C 218 416 204 360 210 301 Z"
      fill="none"
      stroke="#BA3A0E"
      stroke-width="8.5"
      stroke-linejoin="round"
    />
    <!-- Upturned Smile Corners (join cleanly into closed mouth outline) -->
    <path
      id="heroicon_smile-corner-left"
      d="M 196 290 C 200 297 205 300 210 301"
      fill="none"
      stroke="#BA3A0E"
      stroke-width="8.5"
      stroke-linecap="round"
    />
    <path
      id="heroicon_smile-corner-right"
      d="M 316 290 C 312 297 307 300 302 301"
      fill="none"
      stroke="#BA3A0E"
      stroke-width="8.5"
      stroke-linecap="round"
    />
    <!-- Philtrum (stops cleanly inside top lip cusp without protruding into mouth) -->
    <path
      id="heroicon_philtrum"
      d="M 256 244 L 256 280"
      fill="none"
      stroke="#BA3A0E"
      stroke-width="8.5"
      stroke-linecap="butt"
    />
    <!-- Nose -->
    <path
      id="heroicon_nose-body"
      d="M 227 224 C 225 212 238 206 256 206 C 274 206 287 212 285 224 C 283 238 269 250 256 250 C 243 250 229 238 227 224 Z"
      fill="#D44014"
    />
    <ellipse id="heroicon_nose-highlight" cx="256" cy="216" rx="16" ry="5.5" fill="#EC8665" opacity="0.85" />
  </g>

  <!-- LAYER 7: Happy Raised Paws & Lab Coat Cuffs -->
  <g id="heroicon_layer-paws">
    <!-- Left Paw -->
    <g id="heroicon_paw-left">
      <path
        d="M -14 342 C 14 316 58 318 88 346 C 122 378 142 436 128 486 C 118 504 48 504 -14 472 Z"
        fill="url(#heroicon_pawGrad)"
        stroke="#C2430A"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <!-- Toe crease lines -->
      <path
        d="M 18 334 C 0 352 -6 376 -2 400 M 64 338 C 46 356 42 382 48 408"
        fill="none"
        stroke="#C2430A"
        stroke-width="7"
        stroke-linecap="round"
      />
      <!-- Lab coat cuff under left paw -->
      <path
        d="M -14 446 Q 56 494 142 488 L 136 518 L -14 518 Z"
        fill="#EAF3FC"
        stroke="#A2AEBC"
        stroke-width="7"
        stroke-linejoin="round"
      />
      <path d="M 138 502 L 160 506" fill="none" stroke="#A2AEBC" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Right Paw (mirrored) -->
    <g id="heroicon_paw-right">
      <path
        d="M 526 342 C 498 316 454 318 424 346 C 390 378 370 436 384 486 C 394 504 464 504 526 472 Z"
        fill="url(#heroicon_pawGrad)"
        stroke="#C2430A"
        stroke-width="8"
        stroke-linejoin="round"
      />
      <!-- Toe crease lines -->
      <path
        d="M 494 334 C 512 352 518 376 514 400 M 448 338 C 466 356 470 382 464 408"
        fill="none"
        stroke="#C2430A"
        stroke-width="7"
        stroke-linecap="round"
      />
      <!-- Lab coat cuff under right paw -->
      <path
        d="M 526 446 Q 456 494 370 488 L 376 518 L 526 518 Z"
        fill="#EAF3FC"
        stroke="#A2AEBC"
        stroke-width="7"
        stroke-linejoin="round"
      />
      <path d="M 374 502 L 352 506" fill="none" stroke="#A2AEBC" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>

      </g>
    </g>

    <!-- Playful Shrodi Speech Bubble -->
    <g transform="translate(-168, -142)">
      <rect x="0" y="4" width="132" height="36" rx="14" fill="#D9981A"/>
      <rect x="0" y="0" width="132" height="36" rx="14" fill="#FFFFFF"/>
      <polygon points="104,34 118,46 118,32" fill="#FFFFFF"/>
      <text x="66" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#3C3C3C">“But why?”</text>
    </g>

    <!-- Bottom right stat pill -->
    <g transform="translate(36, 98)">
      <rect x="0" y="4" width="140" height="34" rx="13" fill="#131F24"/>
      <rect x="0" y="0" width="140" height="34" rx="13" fill="#27363E"/>
      <circle cx="18" cy="17" r="5" fill="#58CC02"/>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">Expo SDK 58</text>
    </g>
  </g>
</svg>