<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AtomIQ Content Studio</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/">AtomIQ <span>Studio</span></a>
  <span id="version" class="version" title="Content version">…</span>
  <button id="changes-btn" class="ghost" type="button">Changes</button>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Search all content  ( / )" autocomplete="off" aria-label="Search all content" />
  <button id="publish-btn" class="primary" type="button">Publish…</button>
</header>

<div id="shell">
  <nav id="sidebar" aria-label="Content"></nav>

  <aside id="listpane" hidden>
    <div class="list-head">
      <strong id="list-title"></strong>
      <span id="list-count" class="hint"></span>
      <div class="spacer"></div>
      <button id="list-new" class="primary mini-btn" type="button">＋ New</button>
    </div>
    <div class="list-search"><input id="list-search" type="search" placeholder="Filter…" autocomplete="off" aria-label="Filter list" /></div>
    <ul id="list-items"></ul>
  </aside>

  <main id="main"></main>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
